services:
  - type: web
    runtime: static
    name: eazygadgetz
    buildCommand: echo "static"
    staticPublishPath: ./
    autoDeploy: true
    domains:
      - eazygadgetz.de
      - www.eazygadgetz.de
    headers:
      - path: /ring-ii/img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /ring-ii/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /phototag/img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
